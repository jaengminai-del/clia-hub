<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CLIA · Review / Approve</title>
<link rel="icon" href="/shared/assets/clia-icon.svg">
<link rel="stylesheet" href="/css/fonts.css">
<!--
  검토·승인 화면 (2026-11-24, docs/clia-pdp-review/mockups/v12 를 운영으로)
  · 목록: CLIA 크롤 제품 전체 (법인별) — BU·제품군 필터, 리스트/갤러리, 전체 선택 → 선택 승인 · 선택 준비
  · 비교: 왼쪽 lg.com 전체 화면 캡처(PDP 첫 섹션 ~ 스펙 끝), 오른쪽 빌더·벌크가 내려받는 것과 같은 Shopee/Lazada 이미지.
          스크롤 막대 하나로 같은 영역을 같이 움직이고, 짧은 쪽은 끝에서 기다린다. 체크리스트를 다 보면 승인.
  · 데이터: /api/v1/review/* (review.js) · 승인 기록: /api/v1/approvals (approvals.js)
  주소: /review/?lang=th|en|ko&country=th[&url=<LG.com 주소> — 그 제품 비교 화면으로][&embed=1 — 허브 위에 띄움]
-->
<style>
:root{--f:'LGEIHeadline','LINESeedSansTH',-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo',sans-serif;
--g50:#FAF9F5;--g100:#F6F3EB;--g200:#E8E4DC;--g300:#D6D1C7;--g400:#A8A29A;--g500:#7A746C;--g700:#4A4540;--g900:#1F1D1A;
--red:#FD312E;--ok:#1E7F4F;--okb:#E3F4EA;--bad:#C8241F;--badb:#FDE8E7;--warn:#7A5A00;--warnb:#FFF3C4;--line:#ECE8E0}
*{box-sizing:border-box}html,body{margin:0;height:100%}[hidden]{display:none!important}
body{font:14px/1.45 var(--f);color:var(--g900);background:#F8F7F5;overflow:hidden}
html[lang=th] body{font-family:'LINESeedSansTH','LGEIHeadline',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
button{font:inherit;cursor:pointer}button:disabled{cursor:not-allowed}
.top{height:56px;display:flex;align-items:center;gap:12px;padding:0 20px;background:#fff;border-bottom:1px solid var(--line)}
.top img{height:22px}.top .t{font-weight:600}.top .sp{flex:1}
.who{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--g500)}
.who input{border:1px solid var(--g300);border-radius:999px;padding:5px 10px;font:inherit;font-size:12px;width:150px}.who input.err{border-color:var(--bad)}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.b-q{background:var(--g100);color:var(--g500)}.b-ok{background:var(--okb);color:var(--ok)}.b-bad{background:var(--badb);color:var(--bad)}
.b-warn{background:var(--warnb);color:var(--warn)}.b-lock{background:#2b2926;color:#fff}
.btn{border:1px solid var(--g300);background:#fff;border-radius:999px;padding:7px 14px;font-size:13px;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--g500)}.btn.pri{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
.btn.sm{padding:3px 10px;font-size:12px}.btn:disabled{opacity:.45}
.sel{border:1px solid var(--g300);border-radius:999px;padding:5px 10px;font:inherit;font-size:12px;background:#fff}
.view{position:fixed;top:56px;left:0;right:0;bottom:0;display:none;flex-direction:column}.view.on{display:flex}
/* 목록 */
.lhd{display:flex;align-items:center;gap:10px;padding:18px 24px 8px}.lhd h2{margin:0;font-size:22px}.lhd .sp{flex:1}.cnt{font-size:13px;color:var(--g500)}.cnt b{color:var(--g900)}
.note{padding:0 24px 8px;font-size:12px;color:var(--g500)}
.flt{display:flex;align-items:center;gap:8px;padding:6px 24px 10px;flex-wrap:wrap}.flt .sp{flex:1}
.tabs{display:flex;gap:16px;margin-right:10px}.tab{border:0;background:none;padding:6px 0;color:var(--g500);border-bottom:2px solid transparent;font-weight:600}
.tab.on{color:var(--g900);border-color:var(--g900)}.tab b{font-weight:400;margin-left:4px}
details.dd{position:relative}details.dd summary{list-style:none;border:1px solid var(--g300);border-radius:999px;padding:6px 12px;font-size:13px;background:#fff;cursor:pointer}
details.dd summary::-webkit-details-marker{display:none}details.dd[open] summary{border-color:var(--g700)}
.ddp{position:absolute;z-index:20;top:36px;left:0;background:#fff;border:1px solid var(--g200);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:8px;min-width:220px}
.ddp label{display:flex;gap:8px;align-items:center;padding:5px 8px;border-radius:8px;font-size:13px}.ddp label:hover{background:var(--g50)}
.ddp .n{margin-left:auto;color:var(--g400);font-size:12px}.ddp .hint{font-size:11px;color:var(--g400);padding:4px 8px}
.ddp .row{display:flex;gap:6px;padding:4px 8px}.ddp .row button{border:0;background:none;color:var(--g500);font-size:12px;padding:0}
.search{border:1px solid var(--g300);border-radius:999px;padding:7px 14px;width:240px;font:inherit;font-size:13px;margin-left:8px}
.selall{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--g700);margin-left:6px;cursor:pointer}
.seg{display:inline-flex;border:1px solid var(--g300);border-radius:999px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:6px 14px;font-size:13px;color:var(--g500)}.seg button.on{background:var(--g900);color:#fff}
.tbl,.gal{flex:1;overflow:auto;padding:0 24px 90px}.tbl[hidden],.gal[hidden]{display:none}
table{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
th{font-size:12px;color:var(--g500);font-weight:600;background:var(--g50);position:sticky;top:0;z-index:2}
tr.r{cursor:pointer}tr.r:hover td{background:var(--g50)}tr.r.sel td{background:#FFF6F5}
td.th img{width:44px;height:44px;object-fit:cover;object-position:top;background:#fff;border:1px solid var(--line);border-radius:6px;display:block}
td .m,.cb .m{font-weight:700}td .s{font-size:12px;color:var(--g500);max-width:420px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{display:inline-block;width:70px;height:6px;border-radius:3px;background:var(--g100);vertical-align:middle;margin-right:6px;overflow:hidden}.prog i{display:block;height:100%;background:var(--ok)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.card:hover{border-color:var(--g400);box-shadow:0 4px 16px rgba(0,0,0,.06)}.card.sel{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}
.cimg{position:relative;height:200px;background:var(--g50);border-bottom:1px solid var(--line)}
.cimg img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.cimg input{position:absolute;top:10px;left:10px;width:18px;height:18px;accent-color:var(--red)}.cimg .cst{position:absolute;top:8px;right:8px}
.cb{padding:10px 12px 12px;display:grid;gap:5px}.cb .s{font-size:12px;color:var(--g500);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:34px}
.cb .meta{font-size:12px;color:var(--g700)}
.empty{text-align:center;color:#999;padding:30px}
.more{text-align:center;padding:14px}
.selbar{display:none;gap:8px;align-items:center;font-size:13px;color:var(--g700)}.selbar.on{display:flex}
.chd .why{font-size:12px;color:var(--g500);max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chd .cmt{width:220px;border:1px solid var(--g300);border-radius:999px;padding:7px 14px;font:inherit;font-size:13px}.chd .cmt.err{border-color:var(--bad)}

/* 비교 */
.chd{display:flex;align-items:center;gap:12px;padding:10px 20px;background:#fff;border-bottom:1px solid var(--line)}
.chd .id .m{font-weight:700;font-size:16px}.chd .id .s{font-size:12px;color:var(--g500);max-width:460px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chd .sp{flex:1}.chd a.s{display:block;color:var(--g500);text-decoration:none}.chd a.s:hover{text-decoration:underline}
.bar{display:flex;align-items:center;gap:8px;padding:8px 20px;background:#fff;border-bottom:1px solid var(--line)}
.bar input{flex:1;border:1px solid var(--g300);border-radius:999px;padding:7px 14px;font:inherit;font-size:13px}.bar input.err{border-color:var(--bad)}
.banner{padding:8px 20px;font-size:13px;background:var(--warnb);color:var(--warn);display:flex;gap:10px;align-items:center}.banner[hidden]{display:none}
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 340px}
.sc{position:relative;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scroll-snap-type:y proximity}
/* 자석: 구간 시작마다 스냅 점 — 스크롤을 놓으면 가까운 구간 시작(두 쪽 같은 영역이 맨 위에 맞는 자리)에 붙는다 */
#snaps{position:absolute;left:0;top:0;width:1px;pointer-events:none}#snaps i{position:absolute;left:0;width:1px;height:1px;scroll-snap-align:start}
.stage{position:sticky;top:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1px;background:var(--line)}
.pane{display:flex;flex-direction:column;min-height:0;background:#EFEDE8}
/* 패널 머리: 가운데 큰 제목(왼쪽 LG.com · 오른쪽 Shopee/Lazada 토글), 오른쪽 끝에 작은 버튼·경고 */
.ph{flex:none;min-height:52px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:0 14px;background:#fff;border-bottom:1px solid var(--line)}
.ph .ttl{grid-column:2;font-size:18px;font-weight:700;color:var(--g900);letter-spacing:-.01em}
.ph .r{grid-column:3;justify-self:end;display:flex;gap:6px;align-items:center}
.seg.big button{padding:6px 20px;font-size:16px;font-weight:700}
.crop-ed{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:6px 14px;background:#fff;border-bottom:1px solid var(--line);font-size:12px;font-weight:400}.crop-ed[hidden]{display:none}
.crop-ed input{width:74px;border:1px solid var(--g300);border-radius:6px;padding:3px 6px;font:inherit;font-size:12px}
.vp{flex:1;min-height:0;overflow:hidden;position:relative}
.mv{position:absolute;left:0;right:0;top:0;will-change:transform}
.lg{padding:10px 14px}.lg .crop{width:100%;overflow:hidden;background:#fff}.lg .crop img{width:100%;height:auto;display:block}
.noshot{margin:20px;padding:16px;background:#fff;border-radius:10px;font-size:13px;color:var(--g700)}
.mk{width:min(390px,calc(100% - 24px));margin:10px auto;background:#fff}
.mk .h{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;font-size:13px;font-weight:700;border-bottom:1px solid #eee}
.mk .h small{font-weight:400;color:#999;font-size:11px}
.mk .stxt{white-space:pre-wrap;margin:0;padding:12px;font:14px/1.55 Roboto,'Helvetica Neue',Arial,'LINESeedSansTH',sans-serif;color:#222}
.mk .lsum{padding:0 0 4px}.mk .lsum .lg-pdp-summary{padding:14px 12px!important}
.mk .lsum h2{font-size:18px!important;line-height:1.35!important}.mk .lsum h3{font-size:15px!important}.mk .lsum p,.mk .lsum li{font-size:14px!important}
.mk img.sl{width:100%;height:auto;display:block;background:#f4f4f4}.mk img.sl.cut{opacity:.3}
.cutnote{padding:10px 12px;font-size:12px;color:#757575;background:#fafafa;border-top:1px dashed #ddd;border-bottom:1px dashed #ddd}
.mk .nosum{padding:12px;font-size:12px;color:#999;background:#fafafa}
.segbox{position:absolute;pointer-events:none;border:3px solid var(--red);border-radius:6px;box-shadow:0 0 0 9999px rgba(31,29,26,.06) inset}
.segbox.pop{animation:segpop .35s ease-out}@keyframes segpop{from{border-width:6px}to{border-width:3px}}
.segtag{position:absolute;left:18px;max-width:calc(100% - 36px);pointer-events:none;color:#fff;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 2px 8px rgba(0,0,0,.18);z-index:3}
.prep{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#F8F7F5;z-index:5}.prep[hidden]{display:none}
.prep .box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px 26px;min-width:380px;max-width:560px}
.prep h3{margin:0 0 10px;font-size:16px}.prep ol{margin:0 0 12px;padding-left:20px;font-size:13px;color:var(--g500)}.prep li.on{color:var(--g900);font-weight:700}.prep li.done{color:var(--ok)}
.prep .err{color:var(--bad);font-size:13px;margin:0 0 10px;word-break:break-word}.prep p{font-size:12px;color:var(--g500);margin:0 0 12px}
aside{display:flex;flex-direction:column;min-height:0;background:#fff;border-left:1px solid var(--line)}
.ckh{padding:12px 16px 10px;border-bottom:1px solid var(--line)}.ckh b{font-size:14px}.ckh .p{font-size:12px;color:var(--g500);margin-left:8px}
.ckh .prog{width:100%;height:6px;margin:8px 0 0}
.ckl{flex:1;overflow:auto;padding:6px 8px 40px}
.it{border-radius:10px;padding:8px 10px;margin:2px 0;cursor:pointer;border:1px solid transparent}
.it:hover{background:var(--g50)}.it.cur{border-color:var(--red);background:#FFF8F7}
.it .t{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:600}
.it .ic{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--g300);display:inline-flex;align-items:center;justify-content:center;font-size:11px;color:#fff}
.it.seen .ic{background:var(--ok);border-color:var(--ok)}.it.seen .ic::after{content:'✓'}
.it.flag .ic{background:var(--bad);border-color:var(--bad)}.it.flag .ic::after{content:'!'}
.it .t .x{margin-left:auto;visibility:hidden}.it.cur .t .x,.it.flag .t .x,.it:hover .t .x{visibility:visible}.it .t .x button{border:1px solid var(--g300);background:#fff;border-radius:999px;font-size:11px;padding:1px 8px;color:var(--g500);white-space:nowrap}
.it.flag .t .x button{border-color:var(--bad);color:var(--bad)}
.it .look{display:none;margin:6px 0 2px 26px;font-size:12px;color:var(--g700)}.it.cur .look,.it.flag .look{display:block}
.it .look ul{margin:2px 0 6px;padding-left:16px}.it .look li{margin:1px 0}.it .look .sec{color:var(--g500);font-size:11.5px}
.it .look .sec li{font-family:'LINESeedSansTH',var(--f)}
.it .t small.sub{display:block;font-size:11px;font-weight:400;color:var(--g400)}.it .est{font-size:10.5px;color:var(--warn);background:var(--warnb);border-radius:999px;padding:0 6px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--g900);color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}.toast.on{opacity:1}
</style></head>
<body>
<div class="top"><img src="/shared/assets/lg-logo.svg" alt="LG"><span class="t">CLIA Content Hub</span><span class="sp"></span>
 <label class="who"><span data-t="who"></span><input id="who" data-tp="whoPh" autocomplete="name" onchange="setWho(this.value)"></label>
 <select class="sel" id="country" onchange="setCountry(this.value)" aria-label="Country"></select>
 <select class="sel" id="lang" onchange="setLang(this.value)" aria-label="Language"><option value="th">ไทย</option><option value="en">English</option><option value="ko">한국어</option></select>
 <button class="btn" id="closeBtn" hidden onclick="parent.postMessage('clia-review-close','*')">✕</button></div>

<main class="view on" id="vList">
 <div class="lhd"><h2 data-t="h"></h2><span class="cnt" id="okCnt"></span><span class="sp"></span>
  <div class="selbar" id="selbar"><span id="selN"></span><button class="btn" onclick="S.sel.clear();renderList()" data-t="cancel"></button><button class="btn pri" onclick="bulkApprove()" data-t="approveSel"></button></div></div>
 <div class="flt">
  <div class="tabs" id="tabs"></div>
  <details class="dd" id="ddDv"><summary id="sDv"></summary><div class="ddp" id="pDv"></div></details>
  <details class="dd" id="ddGrp"><summary id="sGrp"></summary><div class="ddp" id="pGrp"></div></details>
  <label class="selall"><input type="checkbox" id="selAll" onchange="selAll(this.checked)"><span data-t="selAll"></span></label>
  <span class="sp"></span>
  <input class="search" id="q" type="search" data-tp="search" oninput="S.q=this.value;S.page=1;renderList()">
  <div class="seg" id="viewSeg"><button data-v="list" onclick="setView('list')" data-t="viewList"></button><button data-v="grid" onclick="setView('grid')" data-t="viewGrid"></button></div>
 </div>
 <div class="tbl" id="listBox"><table><thead><tr>
  <th style="width:36px"></th><th style="width:56px"></th><th data-t="thProd"></th><th data-t="thGrp"></th><th data-t="thImgs"></th><th data-t="thSt"></th></tr></thead>
  <tbody id="rows"></tbody></table><div class="more" id="moreL"></div></div>
 <div class="gal" id="galBox" hidden><div class="cards" id="cards"></div><div class="more" id="moreG"></div></div>
</main>

<main class="view" id="vCmp">
 <div class="chd"><button class="btn" onclick="closeCmp()">←</button><div class="id"><div class="m" id="cModel"></div><a class="s" id="cTitle" lang="th" target="_blank" rel="noopener"></a></div>
  <span id="cSt"></span><span class="sp"></span>
  <span class="why" id="bWhy"></span><input class="cmt" id="cmt" data-tp="cmtPh">
  <button class="btn" id="bUndo" hidden onclick="unapprove()" data-t="unapprove"></button><button class="btn" id="bRej" onclick="reject()" data-t="reject"></button><button class="btn pri" id="bOk" onclick="approve()" data-t="approve"></button></div>
 <div class="banner" id="banner" hidden><span id="bannerTx"></span><button class="btn sm" onclick="prepareCur(false)" data-t="reprep"></button></div>
 <div class="main">
  <div class="sc" id="sc">
   <div class="stage" id="stage">
    <section class="pane"><div class="ph"><span class="ttl">LG.com</span><span class="r"><span class="badge b-warn" id="cropWarn" hidden></span><button class="btn sm" id="cropBtn" onclick="toggleCrop()" data-t="cropBtn"></button></span></div>
     <div class="crop-ed" id="cropEd" hidden><span data-t="cropTop"></span><button class="btn sm" onclick="nudge('top',-100)">−100</button><button class="btn sm" onclick="nudge('top',-10)">−10</button><input id="cTop" type="number" onchange="cropInput()"><button class="btn sm" onclick="nudge('top',10)">+10</button><button class="btn sm" onclick="nudge('top',100)">+100</button>
      <span data-t="cropBottom" style="margin-left:8px"></span><button class="btn sm" onclick="nudge('bottom',-100)">−100</button><button class="btn sm" onclick="nudge('bottom',-10)">−10</button><input id="cBot" type="number" onchange="cropInput()"><button class="btn sm" onclick="nudge('bottom',10)">+10</button><button class="btn sm" onclick="nudge('bottom',100)">+100</button>
      <span class="sp" style="flex:1"></span><button class="btn sm" onclick="cropAuto()" data-t="cropAuto"></button><button class="btn sm" onclick="recapture()" data-t="recapture"></button><button class="btn sm pri" onclick="cropSave()" data-t="cropSave"></button></div>
     <div class="vp" id="vpL"><div class="mv" id="mvL"></div><div class="segbox" id="segL" hidden></div><span class="segtag" id="segTagL"></span></div></section>
    <section class="pane"><div class="ph"><div class="seg big ttl" id="chSeg"><button data-c="shopee" onclick="setCh('shopee')">Shopee</button><button data-c="lazada" onclick="setCh('lazada')">Lazada</button></div><span class="r"><span class="badge b-warn" id="imgWarn" hidden></span></span></div><div class="vp" id="vpR"><div class="mv" id="mvR"></div><div class="segbox" id="segR" hidden></div><span class="segtag" id="segTagR"></span></div></section>
   </div>
   <div id="spacer"></div><div id="snaps"></div>
   <div class="prep" id="prep"><div class="box" id="prepBox"></div></div>
  </div>
  <aside><div class="ckh"><b data-t="ck"></b><span class="p" id="ckP"></span><div class="prog"><i id="ckBar"></i></div></div><div class="ckl" id="ckl"></div></aside>
 </div>
</main>
<div class="toast" id="toast"></div>

<script>

 th:{TV:'ทีวี',Audio:'เครื่องเสียง',Monitor:'จอมอนิเตอร์',Laptop:'แล็ปท็อป',Projector:'โปรเจกเตอร์',Fridge:'ตู้เย็น',Washer:'เครื่องซักผ้า',Dryer:'เครื่องอบผ้า',Vacuum:'เครื่องดูดฝุ่น',Dishwasher:'เครื่องล้างจาน',Cooking:'เครื่องครัว',Styler:'สไตเลอร์',AC:'เครื่องปรับอากาศ',Purifier:'เครื่องฟอกอากาศ',Dehumidifier:'เครื่องลดความชื้น',Other:'อื่น ๆ'}};

  tab:'all',q:'',dv:new Set(['MS','HS','ES']),grp:null,sel:new Set(),page:1,who:ls.get('clia-review-who')||'',gate:false,countries:{}};
let DATA=[];        // 목록 (/api/v1/review/list)
let C=null;         // 비교 화면: { p, ch, d: { shopee, lazada }, st: { shopee, lazada }, seen, flags }
const t=(k,...a)=>{const v=TX[S.lang][k]??TX.en[k];return typeof v==='function'?v(...a):v;};
const gname=g=>GRP[S.lang][g]||g;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const x=$('toast');x.textContent=m;x.classList.add('on');clearTimeout(x._h);x._h=setTimeout(()=>x.classList.remove('on'),2600);}
async function api(path,body){
  const r=await fetch(path,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error||j.detail||('HTTP '+r.status));
  return j;
}
// Lazada 요약은 서버가 만든 HTML — 혹시 모를 스크립트·이벤트 속성은 빼고 넣는다
function safeHtml(h){const d=new DOMParser().parseFromString(String(h||''),'text/html');d.querySelectorAll('script,iframe,object,embed,link,meta').forEach(e=>e.remove());
  d.querySelectorAll('*').forEach(e=>[...e.attributes].forEach(a=>{if(/^on/i.test(a.name)||/^\s*javascript:/i.test(a.value))e.removeAttribute(a.name);}));return d.body.innerHTML;}

function applyStatic(){document.documentElement.lang=S.lang;$('lang').value=S.lang;
  document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));document.querySelectorAll('[data-tp]').forEach(e=>e.placeholder=t(e.dataset.tp));
  $('who').value=S.who;}
function setLang(l){S.lang=TX[l]?l:'en';ls.set('clia-review-lang',S.lang);try{const u=new URL(location.href);u.searchParams.set('lang',S.lang);history.replaceState(null,'',u);}catch(_){}
  applyStatic();if(C)renderCmp(false,G?G.s:0);else renderList();}
function setWho(v){S.who=String(v||'').trim().slice(0,120);ls.set('clia-review-who',S.who);$('who').classList.remove('err');}
function needWho(){if(S.who)return false;const w=$('who');w.classList.add('err');w.focus();toast(t('whoNeed'));return true;}
function setView(v){S.view=v;ls.set('clia-review-view',v);renderList();}
function setCountry(c){S.country=c;S.sel.clear();S.page=1;try{const u=new URL(location.href);u.searchParams.set('country',c);history.replaceState(null,'',u);}catch(_){}load();}

// ── 상태 ──
const stOf=p=>({approved:'ok',rejected:'rej',stale:'stale'}[p.approval.status]||'unrev');
const ST={unrev:['stUnrev','b-q'],stale:['stStale','b-warn'],ok:['stOk','b-ok'],rej:['stRej','b-bad']};
const stBadge=p=>{const s=stOf(p);return `<span class="badge ${ST[s][1]}" title="${esc([p.approval.by,p.approval.comment].filter(Boolean).join(' · '))}">${t(ST[s][0])}</span>`;};
const lockBadge=p=>stOf(p)==='ok'?`<span class="badge b-ok">${t('open')}</span>`:S.gate?`<span class="badge b-lock">${t('lock')}</span>`:`<span class="badge b-q">${t('lockOff')}</span>`;
// 체크리스트 진행은 이 브라우저에 남긴다 (본 이미지 묶음 해시가 같을 때만 이어서) — 승인 기록은 서버
const progKey=slug=>'clia-review-prog:'+slug;
const savedProg=p=>{try{const x=JSON.parse(ls.get(progKey(p.slug))||'null');if(x&&CHS.every(ch=>x.h[ch]===(p.prep[ch].hash||'')))return x;}catch(_){}return null;};
function prepCell(p){
  const ss=CHS.map(ch=>p.prep[ch].state);
  if(ss.includes('pending'))return `<span class="badge b-q">${t('prepPending')}</span>`;
  if(ss.includes('error'))return `<span class="badge b-bad" title="${esc(CHS.map(ch=>p.prep[ch].error).filter(Boolean).join(' · '))}">${t('prepError')}</span>`;
  const s=p.prep.shopee.n?p.prep.shopee:p.prep.lazada;
  if(!s.n)return `<span class="badge b-q">${t('prepNone')}</span>`;
  return `${t('nImgs',s.n)}${p.prep.shopee.n&&p.prep.shopee.shopeeN<p.prep.shopee.n?` <span class="badge b-warn" title="${esc(t('shopeeNT',p.prep.shopee.shopeeN))}">${t('shopeeN',p.prep.shopee.shopeeN)}</span>`:''}${ss.includes('stale')?` <span class="badge b-warn">${t('prepStale')}</span>`:''}`;
}
function ckCell(p){if(stOf(p)==='ok'&&p.approval.via==='bulk')return `<span class="badge b-warn">${t('bulkTag')}</span>`;
  const x=savedProg(p);if(!x)return '<span style="color:var(--g400)">—</span>';
  return `<span class="prog"><i style="width:${x.all?x.n/x.all*100:0}%"></i></span>${x.n}/${x.all}${x.flags?` <span class="badge b-bad">${t('diffN',x.flags)}</span>`:''}`;}
const thumbOf=p=>p.prep.shopee.first||p.prep.lazada.first||p.thumb||'';

// ── 목록 (리스트 · 갤러리) ──
const TABS=[['all','tabAll',p=>1],['unrev','tabUnrev',p=>['unrev','stale'].includes(stOf(p))],['ok','tabOk',p=>stOf(p)==='ok'],['rej','tabRej',p=>stOf(p)==='rej']];
const matchQ=p=>!S.q||(p.model+' '+p.title).toLowerCase().includes(S.q.toLowerCase());
function inFilter(p){return S.dv.has(p.dv)&&(!S.grp||S.grp.has(p.grp))&&matchQ(p);}
function visible(){const f=TABS.find(x=>x[0]===S.tab)[2];return DATA.filter(p=>inFilter(p)&&f(p));}
function renderFilters(){
  const base=DATA.filter(matchQ);
  $('tabs').innerHTML=TABS.map(([k,l,f])=>`<button class="tab ${S.tab===k?'on':''}" onclick="S.tab='${k}';S.page=1;renderList()">${t(l)}<b>${DATA.filter(p=>inFilter(p)&&f(p)).length}</b></button>`).join('');
  const dvs=['MS','HS','ES'];
  $('sDv').textContent='BU: '+(S.dv.size===3?t('all'):S.dv.size?[...S.dv].join(', '):t('none'));
  $('pDv').innerHTML=`<div class="row"><button onclick="S.dv=new Set(['MS','HS','ES']);S.grp=null;renderList()">${t('all')}</button><button onclick="S.dv=new Set();renderList()">${t('none')}</button></div>`+
    dvs.map(d=>`<label><input type="checkbox" ${S.dv.has(d)?'checked':''} onchange="tgDv('${d}',this.checked)">${d}<span class="n">${base.filter(p=>p.dv===d).length}</span></label>`).join('');
  const grps=dvs.filter(d=>S.dv.has(d)).flatMap(d=>GRP_ORDER[d].map(g=>[d,g])).filter(([d,g])=>base.some(p=>p.dv===d&&p.grp===g));
  $('sGrp').textContent=t('grpBtn')+': '+(!S.grp?t('all'):S.grp.size?[...S.grp].map(gname).join(', '):t('none'));
  $('pGrp').innerHTML=`<div class="row"><button onclick="S.grp=null;renderList()">${t('all')}</button><button onclick="S.grp=new Set();renderList()">${t('none')}</button></div>`+
    grps.map(([d,g])=>`<label><input type="checkbox" ${!S.grp||S.grp.has(g)?'checked':''} onchange="tgGrp('${g}',this.checked)">${gname(g)} <span class="n">${d} · ${base.filter(p=>p.dv===d&&p.grp===g).length}</span></label>`).join('')+
    `<div class="hint">${t('grpHint')}</div>`;
  document.querySelectorAll('#viewSeg button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.view));
}
function tgDv(d,on){on?S.dv.add(d):S.dv.delete(d);S.page=1;renderList();}
function tgGrp(g,on){if(!S.grp)S.grp=new Set(DATA.map(p=>p.grp));on?S.grp.add(g):S.grp.delete(g);S.page=1;renderList();}
function renderList(){
  renderFilters();const all=visible(),rows=all.slice(0,S.page*PAGE),grid=S.view==='grid',rest=all.length-rows.length;
  $('listBox').hidden=grid;$('galBox').hidden=!grid;
  const box=p=>`<input type="checkbox" ${S.sel.has(p.slug)?'checked':''} onclick="event.stopPropagation()" onchange="sel('${p.slug}',this.checked)">`;
  const img=p=>thumbOf(p)?`<img loading="lazy" src="${esc(thumbOf(p))}" alt="">`:'';
  const more=rest>0?`<button class="btn" onclick="S.page++;renderList()">${t('moreN',Math.min(rest,PAGE))}</button>`:'';
  if(!grid){$('rows').innerHTML=rows.map(p=>`<tr class="r ${S.sel.has(p.slug)?'sel':''}" onclick="openCmp('${p.slug}')">
    <td>${box(p)}</td><td class="th">${img(p)}</td>
    <td><div class="m">${esc(p.model)}</div><div class="s" lang="th">${esc(p.title)}</div></td>
    <td>${p.dv} · ${gname(p.grp)}</td><td>${prepCell(p)}</td><td>${stBadge(p)}</td></tr>`).join('')||`<tr><td colspan="6" class="empty">${t('empty')}</td></tr>`;$('moreL').innerHTML=more;}
  else{$('cards').innerHTML=rows.map(p=>`<div class="card ${S.sel.has(p.slug)?'sel':''}" onclick="openCmp('${p.slug}')">
    <div class="cimg">${img(p)}${box(p)}<span class="cst">${stBadge(p)}</span></div>
    <div class="cb"><div class="m">${esc(p.model)}</div><div class="s" lang="th">${esc(p.title)}</div>
    <div class="meta">${p.dv} · ${gname(p.grp)} · ${prepCell(p)}</div></div></div>`).join('')||`<div class="empty">${t('empty')}</div>`;$('moreG').innerHTML=more;}
  $('selAll').checked=all.length>0&&all.every(p=>S.sel.has(p.slug));$('selAll').disabled=!all.length;
  $('selbar').classList.toggle('on',S.sel.size>0);$('selN').textContent=t('selN',S.sel.size);
  const n=DATA.filter(p=>stOf(p)==='ok').length;$('okCnt').innerHTML=t('okCnt',n,DATA.length);
}
function sel(slug,on){on?S.sel.add(slug):S.sel.delete(slug);renderList();}
function selAll(on){visible().forEach(p=>on?S.sel.add(p.slug):S.sel.delete(p.slug));renderList();}
async function bulkApprove(){
  if(needWho())return;
  const ps=DATA.filter(p=>S.sel.has(p.slug)&&stOf(p)!=='ok');if(!ps.length){S.sel.clear();renderList();return;}
  if(!confirm(t('bulkAsk',ps.length)))return;
  const hashes={};ps.forEach(p=>{hashes[p.slug]={shopee:p.prep.shopee.hash,lazada:p.prep.lazada.hash};});
  try{const j=await api('/api/v1/approvals',{slugs:ps.map(p=>p.slug),state:'approved',via:'bulk',by:S.who,hashes});
    ps.forEach(p=>{if(j.items[p.slug])p.approval={...p.approval,...j.items[p.slug]};});S.sel.clear();renderList();toast(t('bulkToast',Object.keys(j.items).length));}
  catch(e){toast(t('saveErr',e.message));}
}
async function bulkPrepare(){
  const ps=DATA.filter(p=>S.sel.has(p.slug));let n=0;
  for(const p of ps)for(const ch of CHS){if(['ready','pending'].includes(p.prep[ch].state))continue;
    try{await api(`/api/v1/review/item/${encodeURIComponent(p.slug)}/prepare`,{channel:ch});p.prep[ch].state='pending';n++;}catch(e){toast(t('saveErr',e.message));return;}}
  S.sel.clear();renderList();toast(t('prepToast',ps.length));pollList();
}
let listTimer=null;
function pollList(){clearTimeout(listTimer);if(DATA.some(p=>CHS.some(ch=>p.prep[ch].state==='pending')))listTimer=setTimeout(()=>{if(!C)load(true);else pollList();},5000);}
async function load(quiet){
  try{const j=await api('/api/v1/review/list?country='+encodeURIComponent(S.country));
    S.gate=!!j.gate;S.countries=j.countries||{};DATA=j.products||[];
    const cs=Object.entries(S.countries).sort((a,b)=>b[1]-a[1]);if(!S.countries[S.country])cs.unshift([S.country,0]);
    $('country').innerHTML=cs.map(([c,n])=>`<option value="${esc(c)}">${esc(c.toUpperCase())} · ${n}</option>`).join('');$('country').value=S.country;
    applyStatic();if(!C)renderList();pollList();
    if(!quiet&&qs.get('url')){const u=qs.get('url').replace(/\/+$/,'').toLowerCase(),p=DATA.find(x=>x.url.replace(/\/+$/,'').toLowerCase()===u);if(p)openCmp(p.slug);}
  }catch(e){if(!quiet){$('rows').innerHTML=`<tr><td colspan="8" class="empty">${esc(t('loadErr',e.message))}</td></tr>`;}}
}

// ── 비교 화면 ──
let G=null,itemTimer=null;
function closeCmp(){C=null;G=null;clearTimeout(itemTimer);$('vList').classList.add('on');$('vCmp').classList.remove('on');try{const u=new URL(location.href);u.searchParams.delete('url');history.replaceState(null,'',u);}catch(_){}load(true);renderList();}
async function openCmp(slug){
  const p=DATA.find(x=>x.slug===slug);if(!p)return;
  C={p,ch:'shopee',d:{},st:{},err:{},seen:new Set(),flags:new Set()};

// ── 같은 영역 동시 스크롤 ──
// 스크롤 막대는 하나(#sc). 양쪽 내용은 transform 으로 같은 프레임에 같이 움직인다.
// 기준점(서버 review_align.py — lg.com 캡처와 상세 이미지에서 같은 섹션이 시작하는 자리)으로 구간을 나눈다:
//   [PDP 요약(오른쪽에만)] → [PDP 시작 ↔ 첫 상세 이미지] → 섹션 기준점마다 … → [양쪽 끝]
// 한 구간 안에서는 두 쪽이 같은 속도(화면 px)로 같이 움직이고, 그 구간이 짧은 쪽은 구간 끝에서 긴 쪽이 끝날 때까지 기다린다.
// 다음 구간은 두 쪽이 같은 자리(구간 시작)에서 같이 출발한다 → 같은 영역이 늘 같은 높이에 온다.
const SEG_COLOR='#1E7F4F';   // 같은 영역 표시는 초록 한 가지 (구간은 번호 · 이름표로 구분). 빨강은 체크리스트 지금 항목
function layout(){
  const sc=$('sc'),st=$('stage');st.style.height=sc.clientHeight+'px';
  const d=C.d[C.ch],f=shotOf(),vpL=$('vpL'),vpR=$('vpR'),mvL=$('mvL'),mvR=$('mvR'),mk=mvR.querySelector('.mk'),crop=mvL.querySelector('.crop');
  const lmax=Math.max(0,mvL.offsetHeight-vpL.clientHeight),rmax=Math.max(0,mvR.offsetHeight-vpR.clientHeight);
  // 오른쪽 내용 안의 위치 (mvR 기준 — .mk 는 위치 지정이 없어 그 안 요소의 offsetTop 은 mvR 기준이다)
  const anchors={};mvR.querySelectorAll('[data-a]').forEach(e=>anchors[e.dataset.a]=e.offsetTop);
  const sl=[...mvR.querySelectorAll('img.sl')];
  const imgs=sl.map(e=>({e,top:e.offsetTop}));
  // 슬라이스 출력 px → 오른쪽 화면 px (Shopee 에서 빠지는 장 앞 안내 줄도 그대로 반영)
  let cum=[0];d.slices.forEach((x,i)=>cum.push(cum[i]+x.h));
  const rpx=y=>{let i=0;while(i<d.slices.length-1&&y>=cum[i+1])i++;const e=sl[i];return e?e.offsetTop+(Math.min(y,cum[i+1])-cum[i])*(e.clientWidth/d.slices[i].w):0;};
  // lg.com 캡처 px → 왼쪽 화면 px (PDP 범위로 자른 그림 기준)
  const top=f?(CROP?CROP.top:f.top):0,bot=f?(CROP?CROP.bottom:f.bottom):0;
  const lpx=y=>crop?crop.offsetTop+(Math.max(top,Math.min(y,bot))-top)*(crop.clientWidth/f.w):0;
  const P=[{l:0,r:0,label:t('segSum'),kind:'sum'}];
  const al=(d.align&&d.align.anchors)||[];
  const firstLabel=al[0]&&al[0].L-top<60?al[0].label:'';
  P.push({l:crop?crop.offsetTop:0,r:sl[0]?sl[0].offsetTop:0,label:firstLabel||t('segIntro'),kind:'start'});
  al.forEach((a,i)=>{if(i===0&&firstLabel)return;P.push({l:lpx(a.L),r:rpx(a.R),label:a.label||t('segN',i+1),kind:'sec',score:a.score});});
  P.push({l:mvL.offsetHeight,r:mvR.offsetHeight,label:'',kind:'end'});
  // 두 쪽 모두 늘어나는 점만 (앞 점과 같거나 거꾸로면 버린다 — 범위를 사람이 줄였을 때 등)
  const pts=[P[0]];for(const p of P.slice(1)){const q=pts[pts.length-1];if(p.kind==='end'||(p.l>=q.l&&p.r>q.r+4&&(p.l>q.l+4||q.kind==='sum')))pts.push(p);}
  const segs=[];let S=0;
  for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1],dl=Math.max(0,b.l-a.l),dr=Math.max(0,b.r-a.r),len=Math.max(dl,dr);
    if(len<1)continue;segs.push({l:a.l,r:a.r,dl,dr,S,len,label:a.label,kind:a.kind,n:segs.length});S+=len;}
  // 끝: 두 쪽이 모두 끝에 닿는 가장 작은 스크롤량
  const reach=(side,max)=>{for(const g of segs){const x=g[side],dx=side==='l'?g.dl:g.dr;if(x+dx>=max)return g.S+Math.max(0,max-x);}return S;};
  const sMax=Math.max(reach('l',lmax),reach('r',rmax));

  $('snaps').innerHTML=segs.filter(g=>g.S<=sMax).map(g=>`<i style="top:${g.S}px"></i>`).join('')+`<i style="top:${sMax}px"></i>`;
  G={lmax,rmax,sMax,segs,vh:vpR.clientHeight,anchors,imgs,s:G?G.s:0,aligned:al.length};
}
function segAt(s){const g=G.segs;let i=0;while(i<g.length-1&&s+1>=g[i+1].S)i++;return g[i];}   // +1: 스냅이 소수점 아래로 멈춰도 그 구간
// 오른쪽 내용 y 가 화면 맨 위에 오는 스크롤량
function sOfR(y){for(const g of G.segs){if(y<g.r+g.dr||g===G.segs[G.segs.length-1])return Math.min(G.sMax,g.S+Math.max(0,Math.min(y-g.r,g.dr)));}return 0;}
function update(){
  if(!G||!C||!G.segs.length)return;const s=$('sc').scrollTop;G.s=s;
  const g=segAt(s),tt=Math.max(0,s-g.S);
  const posL=g.l+Math.min(tt,g.dl),posR=g.r+Math.min(tt,g.dr);
  const l=Math.min(posL,G.lmax),r=Math.min(posR,G.rmax);

  const doneL=tt>=g.dl||posL>=G.lmax,doneR=tt>=g.dr||posR>=G.rmax;
  for(const im of G.imgs)if(!im.e.src&&im.top<r+G.vh*2.5)im.e.src=im.e.dataset.src;   // 보이는 근처만 읽기
  segMark(g,l,r,doneL&&!doneR,doneR&&!doneL);

// 같은 영역 표시: 지금 구간을 양쪽에 같은 색 테두리 + 같은 이름표(번호 · 섹션 제목)로

function segMark(g,l,r,waitL,waitR){

    const box=$('seg'+k),tag=$('segTag'+k);
    box.hidden=h<2;box.style.borderColor=col;box.style.top=y+'px';box.style.height=h+'px';
    tag.style.background=col;tag.style.top=Math.max(6,Math.min(y+6,G.vh-30))+'px';
    // 기다리는 쪽은 이름표에 「기다리는 중」 (따로 배지를 두지 않는다)
    tag.textContent=h<2?`${num} · ${g.label} — ${t(k==='L'?'segNoneL':'segNoneR')}`:`${num} · ${g.label}`+((k==='L'?waitL:waitR)?` · ${t('waitShort')}`:'');
  });

  const cr=$('mvL').querySelector('.crop');if(cr){$('segL').style.left=cr.offsetLeft+'px';$('segL').style.width=cr.clientWidth+'px';}
}
// 체크리스트: 지금 보는 항목(화면 위에서 35% 선을 지난 마지막 항목), 화면 55% 선을 지난 항목은 「봤음」
let curId=null;
function track(r){
  const list=items(C.ch);if(!list.length)return;let cur=null,ch=false;
  for(const it of list){const y=G.anchors[it.anchor];if(y==null)continue;
    if(y<=r+G.vh*0.35)cur=it;
    if(y<=r+G.vh*0.55&&!C.seen.has(it.id)){C.seen.add(it.id);ch=true;}}
  if(G.s>=G.sMax-2)list.forEach(it=>{if(!C.seen.has(it.id)){C.seen.add(it.id);ch=true;}});   // 끝까지 내리면 남은 것도 봄
  if(!cur)cur=list[0];

  if(ch||cur.id!==curId){curId=cur.id;renderCk();renderBar();}
}
function renderCk(){
  const list=items(C.ch),pr=progress();
  $('ckP').innerHTML=t('ckP',C.ch==='shopee'?'Shopee':'Lazada',list.filter(it=>C.seen.has(it.id)).length,list.length,pr.n,pr.all)+(pr.flags?` · <b style="color:var(--bad)">${t('diffN',pr.flags)}</b>`:'');
  $('ckBar').style.width=(pr.all?pr.n/pr.all*100:0)+'%';
  $('ckl').innerHTML=list.map(it=>`<div class="it ${C.seen.has(it.id)?'seen':''} ${C.flags.has(it.id)?'flag':''} ${it.id===curId?'cur':''}" onclick="jumpTo('${it.anchor}')">
    <div class="t"><span class="ic"></span><span>${esc(it.title)}${it.sub?`<small class="sub">${esc(it.sub)}</small>`:''}</span><span class="x"><button onclick="event.stopPropagation();flag('${it.id}')">${C.flags.has(it.id)?t('flagOn'):t('flag')}</button></span></div>
    <div class="look"><ul>${it.look.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>${it.usps&&it.usps.length?`<div class="sec">${t('uspHead')}<ul lang="th">${it.usps.slice(0,10).map(u=>`<li>${esc(u.t)}${u.est?` <span class="est" title="${esc(t('estT'))}">${t('est',u.range[0],u.range[1])}</span>`:''}</li>`).join('')}${it.usps.length>10?`<li>${t('more',it.usps.length-10)}</li>`:''}</ul></div>`:''}</div></div>`).join('');
  const c=$('ckl').querySelector('.it.cur');if(c){const L=$('ckl');if(c.offsetTop<L.scrollTop||c.offsetTop+c.offsetHeight>L.scrollTop+L.clientHeight)L.scrollTop=c.offsetTop-40;}
}
function jumpTo(a){if(!G)return;const y=G.anchors[a];if(y==null)return;$('sc').scrollTop=sOfR(Math.max(0,y-16));}
function flag(id){C.flags.has(id)?C.flags.delete(id):C.flags.add(id);
  const it=allItems().find(x=>x.id===id),c=$('cmt');if(C.flags.has(id)&&it){c.value=(c.value?c.value+' · ':'')+it.title+': '+t('flagNote');}saveProg();renderCk();renderBar();}
function renderBar(){
  if(!C)return;const p=C.p,s=stOf(p),done=s==='ok',both=CHS.every(ready),pr=progress();
  const stale=CHS.some(ch=>C.st[ch]&&C.st[ch].state==='stale');
  const why=done?t('whyDone'):stale?t('whyStale'):!both?t('whyPrep'):pr.flags?t('whyFlag',pr.flags):pr.n<pr.all?t('whyProg',pr.n,pr.all):'';
  // 버튼 자리는 늘 같다: 오른쪽 위 [반려 | 승인 취소] [승인]. 승인을 못 하는 까닭은 그 왼쪽 한 줄로
  $('bWhy').textContent=why;$('bWhy').title=why;$('bOk').disabled=!!why;$('bRej').hidden=done;$('bUndo').hidden=!done;
  $('cSt').innerHTML=stBadge(p);
}
async function decide(state,via){
  const c=$('cmt');
  const j=await api(`/api/v1/approvals/${encodeURIComponent(C.p.slug)}`,{state,via,by:S.who,comment:c.value.trim(),
    hashes:{shopee:C.d.shopee?C.d.shopee.hash:'',lazada:C.d.lazada?C.d.lazada.hash:''}});
  const it=j.items[C.p.slug];if(it)C.p.approval={...it};renderBar();
}
async function approve(){if($('bOk').disabled||needWho())return;try{await decide('approved','checklist');toast(t('okToast'));}catch(e){toast(t('saveErr',e.message));}}
async function reject(){const c=$('cmt');if(!c.value.trim()){c.classList.add('err');c.placeholder=t('rejPh');c.focus();return;}if(needWho())return;
  try{await decide('rejected','checklist');c.classList.remove('err');toast(t('rejToast'));}catch(e){toast(t('saveErr',e.message));}}
async function unapprove(){if(needWho())return;try{await decide('pending','checklist');toast(t('undoToast'));}catch(e){toast(t('saveErr',e.message));}}

$('sc').addEventListener('scroll',update,{passive:true});
addEventListener('resize',()=>{if(C&&C.d[C.ch]&&G){const s=G.s;layout();$('sc').scrollTop=Math.min(s,G.sMax);update();}});
document.querySelectorAll('details.dd').forEach(d=>d.addEventListener('toggle',()=>{if(d.open)document.querySelectorAll('details.dd').forEach(o=>o!==d&&(o.open=false));}));
document.addEventListener('click',e=>{document.querySelectorAll('details.dd[open]').forEach(d=>{if(!d.contains(e.target))d.open=false;});});
document.fonts&&document.fonts.ready.then(()=>{if(C&&C.d[C.ch]&&G){const s=G.s;layout();$('sc').scrollTop=Math.min(s,G.sMax);update();}});
addEventListener('keydown',e=>{if(e.key==='Escape'&&qs.get('embed')==='1'&&!C)parent.postMessage('clia-review-close','*');});
if(qs.get('embed')==='1')$('closeBtn').hidden=false;
applyStatic();load();
</script>
</body></html>
