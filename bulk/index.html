<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Bulk Excel — CLIA</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/svg+xml" href="../shared/assets/clia-icon.svg">
<link rel="stylesheet" href="../css/fonts.css">
<link rel="stylesheet" href="../shared/clia-ui.css">
<link rel="stylesheet" href="bulk-market.css">
<style>
:root { --line: var(--clia-gray-200); --muted: var(--clia-gray-500); --ok: #1E7F4F; --warn: #A15C00; --bad: #C8241F; --red: var(--clia-brand); }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; font-family: var(--clia-font), 'LINESeedSansTH', sans-serif; background: var(--clia-page); color: var(--clia-gray-900); font-size: 14px; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; }
button { font-family: inherit; }
.hd { flex: none; height: 60px; display: flex; align-items: center; gap: 10px; padding: 0 20px; background: #fff; border-bottom: 1px solid var(--line); }
.hd .t { font-weight: 700; font-size: 16px; }
.hd .ch { display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 999px; background: var(--clia-gray-900); color: #fff; font-size: 12px; font-weight: 700; }
.hd .sp { flex: 1; }
.x { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--clia-gray-300); background: #fff; cursor: pointer; font-size: 16px; color: var(--clia-gray-700); }
.x:hover { border-color: var(--clia-gray-700); }
.body { flex: 1; overflow: auto; }
.wrap { max-width: 1560px; margin: 0 auto; padding: 24px 28px 120px; }   /* 표 칸이 많아 넓은 화면은 더 쓴다 (2026-11-24) */

/* 1. 첨부 */
.drop { background: #fff; border: 2px dashed var(--clia-gray-300); border-radius: 20px; padding: 64px 24px; text-align: center; cursor: pointer; transition: border-color .2s, background .2s, transform .2s; }
.drop:hover, .drop.over { border-color: var(--red); background: #FFF8F7; }
.drop.over { transform: scale(1.01); }
.drop .ico { width: 64px; height: 64px; margin: 0 auto 14px; display: block; color: var(--red); }
.drop .big { font-size: 18px; font-weight: 700; }
.drop .small { color: var(--muted); margin-top: 8px; font-size: 13px; }
.ecard { display: flex; gap: 14px; align-items: flex-start; margin-top: 16px; padding: 18px 20px; border-radius: 14px; background: #FDF1F0; border: 1px solid #F6C9C6; animation: rise .3s ease both; }
.ecard svg { width: 24px; height: 24px; flex: none; fill: none; stroke: var(--bad); stroke-width: 2; stroke-linecap: round; }
.ecard .et, .empty .et { font-weight: 700; font-size: 15px; color: var(--clia-gray-900); }
.ecard .eb, .empty .eb { margin-top: 4px; color: var(--clia-gray-700); line-height: 1.55; font-size: 13px; }
.ecard .ef { margin-top: 6px; color: var(--muted); font-size: 12px; }
.empty { background: #fff; border: 1px dashed var(--clia-gray-300); border-radius: 14px; padding: 28px 24px; text-align: center; margin-bottom: 12px; }
.ask.mis { background: #FFF4E0; border-color: #F3D9A8; }
.ask .f { color: var(--clia-gray-700); font-size: 13px; margin-top: 2px; }

/* 2. 인식·매칭 */
.proc { background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 48px 24px; text-align: center; }
.sheet { width: 72px; height: 88px; margin: 0 auto 22px; position: relative; border-radius: 10px; background: #fff; border: 2px solid var(--clia-gray-900); overflow: hidden; animation: pop .45s cubic-bezier(.2,1.4,.4,1) both; }
.sheet::before { content: ''; position: absolute; left: 10px; right: 10px; top: 16px; height: 52px;
  background: repeating-linear-gradient(to bottom, var(--clia-gray-200) 0 6px, transparent 6px 13px); }
.sheet::after { content: 'XLSX'; position: absolute; left: 0; right: 0; bottom: 0; height: 18px; background: #1E7F4F; color: #fff; font-size: 10px; font-weight: 700; line-height: 18px; letter-spacing: .5px; }
.sheet i { position: absolute; left: 0; right: 0; height: 26px; top: -26px; background: linear-gradient(to bottom, transparent, rgba(253,49,46,.35), transparent); animation: scan 1.2s ease-in-out infinite; }
.proc .msg { font-size: 17px; font-weight: 700; min-height: 26px; }
.proc .fn { color: var(--muted); font-size: 13px; margin-top: 6px; }
.dots::after { content: ''; animation: dots 1.2s steps(4) infinite; }
.bar2 { width: 240px; height: 4px; border-radius: 2px; background: var(--clia-gray-100); margin: 20px auto 0; overflow: hidden; }
.bar2 i { display: block; width: 40%; height: 100%; background: var(--red); border-radius: 2px; animation: slide 1.1s ease-in-out infinite; }
@keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes scan { 0% { top: -26px; } 100% { top: 88px; } }
@keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
@keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }

/* 3. 목록 */
.res-h { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.res-h .n { font-size: 20px; font-weight: 700; }
.res-h .f { color: var(--muted); font-size: 13px; }
.res-h .again { margin-inline-start: auto; border: 0; background: none; text-decoration: underline; color: var(--clia-gray-700); cursor: pointer; font-size: 13px; }
.ctl { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.pill { height: 36px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--clia-gray-300); background: #fff; color: var(--clia-gray-700); cursor: pointer; font-size: 13px; font-weight: 600; }
.pill:hover { border-color: var(--clia-gray-700); }
.pill.on { background: var(--clia-gray-900); border-color: var(--clia-gray-900); color: #fff; }
.pill b { opacity: .6; margin-inline-start: 6px; }
.ctl .div { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
.pill.part { background: var(--clia-gray-100); border-color: var(--clia-gray-900); color: var(--clia-gray-900); }
.ctl2 .pill { height: 30px; padding: 0 12px; font-size: 12px; font-weight: 500; }
.srch { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.srch input { flex: 1 1 260px; max-width: 360px; height: 36px; border: 1px solid var(--clia-gray-300); border-radius: 999px; padding: 0 16px; font: inherit; font-size: 13px; background: #fff; }
.srch input:focus { outline: none; border-color: var(--red); box-shadow: 0 0 0 3px var(--clia-brand-soft); }
.qact { display: inline-flex; gap: 8px; align-items: center; font-size: 13px; color: var(--clia-gray-700); }
.qact .pill { height: 30px; padding: 0 12px; font-size: 12px; }
.tip { margin-inline-start: auto; color: var(--muted); font-size: 12px; }
.item.hidden { display: none; }
/* 보기 전환 (리스트 · 갤러리) */
.view { display: inline-flex; border: 1px solid var(--clia-gray-300); border-radius: 999px; overflow: hidden; background: #fff; flex: none; }
.view button { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border: 0; background: none; cursor: pointer; color: var(--clia-gray-600); font-size: 12px; font-weight: 600; }
.view button svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.view button.on { background: var(--clia-gray-900); color: #fff; }
.tip + .view { margin-inline-start: 4px; }
/* 갤러리: 같은 항목을 카드로 */
.list.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; background: none; border: 0; border-radius: 0; overflow: visible; }
.list.grid .item { position: relative; display: flex; flex-direction: column; align-items: stretch; gap: 8px; padding: 12px; border: 1px solid var(--line); border-radius: 14px; background: #fff; transition: border-color .15s, box-shadow .15s; }
.list.grid .item:hover { background: #fff; border-color: var(--clia-gray-400); box-shadow: var(--clia-shadow); }
.list.grid .item:has(input:checked) { border-color: var(--red); box-shadow: 0 0 0 1px var(--red); }
.list.grid .item.off { opacity: .6; }
.list.grid .item input { position: absolute; top: 12px; inset-inline-start: 12px; z-index: 1; width: 20px; height: 20px; }
.list.grid .item img { width: 100%; height: 150px; border-radius: 10px; object-fit: contain; background: var(--clia-gray-50); }
.list.grid .item .s { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; min-height: 2.8em; }
.list.grid .item .m { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.list.grid .item .r { align-items: flex-start; text-align: start; min-height: 20px; }
@media (max-width: 640px) { .list.grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; } .list.grid .item img { height: 110px; } .list.grid .item { grid-column: auto; } .list.grid .item .r { grid-column: auto; } }
.list { background: #fff; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.item { display: grid; grid-template-columns: 22px 48px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--clia-gray-100); cursor: pointer;
  animation: rise .35s ease both; }
.item:last-child { border-bottom: 0; }
.item:hover { background: var(--clia-gray-50); }
.item.off { opacity: .55; }
.item img { width: 48px; height: 48px; object-fit: contain; border-radius: 8px; background: var(--clia-gray-50); }
.item .m { font-weight: 700; }
.item .s { color: var(--muted); font-size: 12px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .r { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; text-align: end; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--red); cursor: pointer; margin: 0; }
.badge { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; white-space: nowrap; }
.b-rep { background: #FFF1DC; color: var(--warn); }
.b-ok { background: #E3F4EA; color: var(--ok); }
.b-bad { background: #FDE8E7; color: var(--bad); }
.b-run { background: #E8EEF9; color: #2A4E8F; }
.b-q { background: var(--clia-gray-100); color: var(--clia-gray-500); }
.note { font-size: 11px; color: var(--muted); max-width: 260px; }
details.skip { margin-top: 14px; color: var(--clia-gray-700); font-size: 13px; }
details.skip summary { cursor: pointer; }
details.skip ul { margin: 8px 0 0; padding-inline-start: 20px; color: var(--muted); line-height: 1.7; }
.ask { background: #FFF8EC; border: 1px solid #F3D9A8; border-radius: 12px; padding: 12px 16px; margin-bottom: 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.ask select { height: 34px; border: 1px solid var(--clia-gray-300); border-radius: 8px; padding: 0 10px; max-width: 100%; }

.foot { flex: none; background: #fff; border-top: 1px solid var(--line); padding: 14px 20px; display: none; }
.foot .in { max-width: 1264px; margin: 0 auto; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.foot .sp { flex: 1; }
.prog { height: 6px; width: 180px; border-radius: 3px; background: var(--clia-gray-100); overflow: hidden; }
.prog i { display: block; height: 100%; width: 0; background: var(--red); transition: width .3s; }
.clia-btn.big { height: 44px; padding: 0 26px; font-size: 15px; }
a.clia-btn { text-decoration: none; }
/* 일괄 등록 · 확인 필요 · 알림 · 장면 고르기 (2026-11-19) */
.resume { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; padding: 12px 16px; border-radius: 12px; background: #fff; border: 1px solid var(--line); font-size: 13px; }
.reg { background: #F2F6FD; border: 1px solid #C9D7F2; border-radius: 14px; padding: 14px 18px; margin-bottom: 14px; }
.regt { font-weight: 700; margin-bottom: 8px; }
.regn { color: var(--clia-gray-700); font-size: 12px; margin-top: 6px; }
.regn b { color: #2A4E8F; }
.sw { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 600; }
.sw input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.sw .tr { width: 40px; height: 22px; border-radius: 11px; background: var(--clia-gray-300); position: relative; transition: background .15s; flex: none; }
.sw .tr::after { content: ''; position: absolute; top: 3px; inset-inline-start: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; }
.sw input:checked + .tr { background: var(--red); }
.sw input:checked + .tr::after { transform: translateX(18px); }
[dir=rtl] .sw input:checked + .tr::after { transform: translateX(-18px); }
.sw input:focus-visible + .tr { outline: 2px solid var(--red); outline-offset: 2px; }
.rvban { background: #FDE8E7; color: var(--bad); border: 1px solid #F6C9C6; border-radius: 12px; padding: 10px 16px; margin-bottom: 12px; font-weight: 700; font-size: 13px; }
.item.rv { background: #FFF6F5; }
.list.grid .item.rv { background: #FFF6F5; }
.rvt { margin-inline-end: 6px; vertical-align: 1px; }
.ph { width: 48px; height: 48px; border-radius: 8px; background: var(--clia-gray-100); color: var(--clia-gray-500); font-size: 10px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 2px; overflow: hidden; }
.list.grid .item .ph { width: 100%; height: 150px; font-size: 13px; }
.fl { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; align-items: flex-end; }
.fx { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; font-size: 12px; color: var(--bad); font-weight: 600; max-width: 460px; text-align: end; }
.list.grid .fl, .list.grid .fx { align-items: flex-start; justify-content: flex-start; text-align: start; }
.mini { height: 26px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--clia-gray-300); background: #fff; color: var(--clia-gray-900); font: 600 11px/24px var(--clia-font), sans-serif; cursor: pointer; text-decoration: none; white-space: nowrap; }
.mini:hover { border-color: var(--clia-gray-700); }
.pick { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border: 1px solid var(--clia-gray-300); border-radius: 999px; background: #fff; color: var(--clia-gray-900); font: 600 12px var(--clia-font), sans-serif; cursor: pointer; }
.pick:has(img) { padding-inline-start: 3px; }
.pick img { width: 24px; height: 24px; object-fit: contain; border-radius: 999px; background: var(--clia-gray-50); }
.pick:hover { border-color: var(--clia-gray-900); }
.pick .pc { color: var(--muted); font-weight: 500; font-size: 11px; }
.eb { display: inline-flex; align-items: center; gap: 5px; height: 30px; padding: 0 11px 0 9px; border: 1px solid var(--clia-gray-300); border-radius: 8px; background: #fff; color: var(--clia-gray-900); font: 600 12px var(--clia-font), sans-serif; text-decoration: none; white-space: nowrap; }
.eb:hover { border-color: var(--clia-gray-900); }
.eb svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.eb:focus-visible { outline: 2px solid var(--clia-gray-900); outline-offset: 2px; }
button.eb { cursor: pointer; }
.b-ed { background: #EDE7FB; color: #5B3DB5; margin-inline-start: 6px; }
.b-edx { background: #FFF1D6; color: #8A5300; margin-inline-start: 6px; }
/* 편집(빌더) 덮개 — 벌크 화면 전체 위 */
.edov { position: fixed; inset: 0; z-index: 50; background: #fff; }
.edov iframe { width: 100%; height: 100%; border: 0; display: block; }
/* 한 건 상세 패널 (2026-11-24) */
.item.cur { box-shadow: inset 3px 0 0 var(--clia-gray-900); background: var(--clia-gray-50); }
.dw { position: fixed; inset: 0; z-index: 40; }
.dw-bg { position: absolute; inset: 0; background: rgba(20,20,20,.28); }
.dw-p { position: absolute; top: 0; bottom: 0; inset-inline-end: 0; width: min(540px, 100vw); background: #fff; box-shadow: -12px 0 32px rgba(0,0,0,.14); display: flex; flex-direction: column; animation: dwIn .18s ease-out; }
@keyframes dwIn { from { transform: translateX(24px); opacity: 0; } to { transform: none; opacity: 1; } }
.dw-top { flex: none; display: flex; align-items: center; gap: 6px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.dw-top .sp { flex: 1; }
.dw-nav, .dw-x { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--clia-gray-300); background: #fff; color: var(--clia-gray-900); font: 600 16px/1 var(--clia-font), sans-serif; cursor: pointer; }
.dw-nav:disabled { opacity: .35; cursor: default; }
.dw-pos { font-size: 12px; color: var(--muted); min-width: 64px; text-align: center; }
.dw-inc { display: inline-flex; align-items: center; gap: 6px; margin-inline-start: 10px; font-size: 13px; font-weight: 600; cursor: pointer; }
.dw-body { flex: 1; overflow: auto; padding: 18px 20px 40px; }
.dw-hd { display: flex; gap: 14px; align-items: flex-start; padding-bottom: 16px; border-bottom: 1px solid var(--clia-gray-100); }
.dw-hd img, .dw-hd .ph { width: 88px; height: 88px; border-radius: 10px; object-fit: contain; background: var(--clia-gray-50); flex: none; }
.dw-m { font-size: 18px; font-weight: 800; overflow-wrap: anywhere; }
.dw-sub { margin-top: 4px; font-size: 12px; color: var(--clia-gray-700); font-weight: 600; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.dw-acts { margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
.dw-body section { padding: 16px 0; border-bottom: 1px solid var(--clia-gray-100); }
.dw-body section:last-child { border-bottom: 0; }
.dw-body h4 { margin: 0 0 10px; font-size: 12px; font-weight: 700; color: var(--clia-gray-600); letter-spacing: .02em; }
.dw-dl { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 8px 12px; margin: 0; font-size: 13px; }
.dw-dl dt { color: var(--muted); }
.dw-dl dd { margin: 0; color: var(--clia-gray-900); overflow-wrap: anywhere; }
.dw-cur { color: var(--clia-gray-700); font-size: 12px; line-height: 1.5; max-height: 4.5em; overflow: hidden; }
.dw-note { margin-top: 6px; font-size: 12px; color: var(--warn); }
.dw-why { font-size: 13px; }
.dw-ac { margin-top: 10px; display: flex; gap: 6px; }
.dw-ac .mini { color: #fff; background: var(--clia-brand); border-color: var(--clia-brand); font-weight: 700; }
.dw-ac .mini.un { color: var(--clia-gray-900); background: #fff; border-color: var(--clia-gray-300); }
.mut { color: var(--clia-gray-500); }
.dw-empty { font-size: 13px; color: var(--muted); padding: 14px; border-radius: 10px; background: var(--clia-gray-50); }
.dw-meta { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
/* 엑셀에 들어갈 설명 = 상세 페이지 한 장: 요약 글 → 이미지를 이어 붙임 (사이 틈 없음) */
.dw-page { border: 1px solid var(--clia-gray-200); border-radius: 10px; overflow: hidden; background: #fff; }
.dw-page img { display: block; width: 100%; height: auto; }
.dw-sum { white-space: pre-wrap; font-size: 13px; line-height: 1.6; color: var(--clia-gray-900); padding: 16px 18px; border-bottom: 1px solid var(--clia-gray-100); }
/* HTML 한 페이지: 1000px 폭을 패널 폭에 맞춰 줄이고 높이는 내용만큼 (bulk.js fitFrames) */
.dw-frame { border: 1px solid var(--clia-gray-100); border-radius: 10px; overflow: hidden; height: 480px; }
.dw-page .dw-frame { border: 0; border-radius: 0; }
.dw-frame iframe { display: block; width: 1000px; height: 2000px; border: 0; transform: scale(.48); transform-origin: 0 0; }
[dir=rtl] .dw-frame iframe { transform-origin: 100% 0; }
@media (max-width: 640px) { .dw-p { width: 100vw; } }
/* 표 하나 (2026-11-24): 제품 · 상품명 · 상태 · 확인 필요 내용 · Next step · 직접 편집하기 — 매칭 완료 · 확인 필요 · 매칭 불가 모두.
   탭은 거르기만. 넓은 화면의 리스트 보기에서만 칸으로, 휴대폰 · 갤러리 보기는 카드 */
.lhead { display: none; }
.item .pn { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: var(--clia-gray-900); line-height: 1.4; word-break: break-word; margin-top: 0; }
.item .bu { color: var(--clia-gray-700); font-size: 12px; font-weight: 600; }
.item .k { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.item .k.nosku { color: var(--clia-gray-500); font-weight: 600; font-style: italic; }
.item.nm { cursor: default; }
.item.nm:hover { background: none; }
@media (max-width: 640px) {

.ck-run { display: flex; align-items: center; gap: 10px; color: var(--clia-gray-700); font-size: 14px; } .ck-run::before { content: ''; width: 14px; height: 14px; border-radius: 50%; }
@keyframes ckspin { to { transform: rotate(360deg); } }
.ck-go { margin-top: 30px; display: flex; align-items: center; gap: 12px; }
.ck-go .clia-btn.primary:focus-visible, .ck-go .clia-btn.primary:focus { outline: 3px solid rgba(253, 49, 46, .28); outline-offset: 2px; }
.ck-kbd { font-size: 12px; color: var(--muted); } .ck-kbd b { display: inline-block; border: 1px solid var(--clia-gray-300); border-bottom-width: 2px; border-radius: 5px; padding: 0 6px; font-weight: 500; color: var(--clia-gray-700); font-size: 11px; line-height: 18px; }
.ck-why { margin-top: 26px; padding: 12px 14px; border-radius: 10px; background: #FDF1F0; color: var(--bad); font-size: 13px; line-height: 1.5; }
.ck-go2 { margin-top: 14px; display: flex; gap: 8px; flex-wrap: wrap; }
.ck-done { text-align: center; padding: 56px 24px; } .ck-ic { width: 56px; height: 56px; border-radius: 50%; background: #E7F4EC; color: var(--ok); display: flex; align-items: center; justify-content: center; margin: 0 auto 18px; }
.ck-ic svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.ck-dt { font-size: 20px; font-weight: 700; } .ck-ds { margin-top: 8px; font-size: 14px; color: var(--muted); } .ck-done .clia-btn { margin-top: 26px; }
@media (max-width: 760px) { .ck-b { flex-direction: column; gap: 18px; overflow: auto; } .ck-phone { width: 100%; max-height: 70vh; } }
</style>
</head>
<body>
<div class="hd"><span class="t" data-i="title"></span><span class="ch hidden" id="chTag"></span><span class="sp"></span><button class="x" id="close" aria-label="Close">✕</button></div>
<div class="body"><div class="wrap">

  <section id="s1">
    <div class="drop" id="drop">
      <input type="file" id="file" accept=".xlsx" hidden>
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3h11l5 5v13H4z"/><path d="M15 3v5h5"/><path d="M12 18v-7M9 14l3-3 3 3"/></svg>
      <div class="big" data-i="drop"></div>
      <div class="small" data-i="dropSub"></div>
    </div>
    <div class="resume hidden" id="resume"><span id="resumeT"></span><button class="pill on" id="resumeB"></button><button class="pill hidden" id="resumeS" type="button"></button></div>
    <div class="ecard hidden" id="ecard" role="alert"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M12 7.5v5.5M12 16.5v.01"/></svg><div><div class="et" id="et"></div><div class="eb" id="eb"></div><div class="ef" id="ef"></div></div></div>
  </section>

  <section id="s2" class="hidden">
    <div class="proc"><div class="sheet"><i></i></div><div class="msg"><span id="pmsg"></span><span class="dots"></span></div><div class="fn" id="pfile"></div><div class="bar2"><i></i></div></div>
  </section>

  <section id="s3" class="hidden">
    <div class="ask mis hidden" id="askMis"><div style="flex:1 1 320px"><b id="misT"></b><div id="misB" class="f"></div></div><button class="pill on" id="misA"></button><button class="pill" id="misB2"></button></div>
    <div class="ask hidden" id="askCh"><span data-i="askCh"></span><button class="pill" data-ch="shopee">Shopee</button><button class="pill" data-ch="lazada">Lazada</button></div>
    <div class="ask hidden" id="askDesc"><span data-i="askDesc"></span><select id="descSel"></select></div>
    <!-- 작업 상황판: 파일 · 지금 상태 · 진행 · 내보내기 · 알림 · 일괄 등록 — 화면을 내려도 맨 위에 고정 -->
    <div class="panel" id="panel">
      <div class="p-top">
        <div class="p-file"><svg viewBox="0 0 24 24"><path d="M4 3h11l5 5v13H4z"/><path d="M15 3v5h5"/></svg><span class="pfn" id="pFile"></span><button class="again" id="again" data-i="again"></button></div>
        <div class="p-act">
          <a class="clia-btn primary big hidden" id="dl" data-i="dlAgain"></a>
          <button class="clia-btn big hidden" id="stop" type="button"></button>
          <button class="clia-btn primary big" id="export"></button>
        </div>
      </div>
      <div class="p-stat" id="info" aria-live="polite"></div>
      <div class="prog hidden" id="prog"><i></i></div>
      <!-- CLIA 에 없지만 LG.com 에 있는 상품: 한 줄 + 버튼 하나 (2026-11-19). 올리자마자 팝업(#rg)으로도 묻는다 -->
      <div class="p-reg hidden" id="regCard"><span class="regt" id="regT"></span><button class="sw" id="regBtn" type="button" role="switch" aria-checked="false" aria-labelledby="regT"><i></i></button></div>
    </div>
    <div class="empty hidden" id="noMatch"><div class="et" id="noMatchT"></div><div class="eb" id="noMatchB"></div></div>
    <!-- 작업 영역: 큰 흰 상자 하나 — 위에 탭(밑줄), 그 아래 도구 줄, 그 아래 목록 -->
    <div class="work" id="work">
      <div class="wtabs" id="tabs" role="tablist"></div>
            <div class="wbar" id="selbar">
        <button class="ctlb selall" id="selAll" type="button"><span class="cb" id="selCb"></span><span id="selL"></span><b id="selN"></b></button>
        <div class="ddw"><button class="ctlb" id="dvBtn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="dvPop"></button><div class="ddpop hidden" id="dvPop" role="menu"></div></div>
        <div class="ddw"><button class="ctlb" id="grpBtn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="ctl2"></button><div class="ddpop wide hidden" id="ctl2" role="menu"></div></div>
        <span class="sp"></span>
        <label class="sbox"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input type="search" id="q" autocomplete="off"></label>
        <span class="view" id="view" role="group"><button data-v="list" type="button"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg><span class="sr" id="vList"></span></button><button data-v="grid" type="button"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span class="sr" id="vGrid"></span></button></span>
      </div>
      <div class="lhead hidden" id="lhead" aria-hidden="true"></div>
<div class="list" id="list"></div>
          </div>
  </section>

</div></div>
<div class="modal hidden" id="xp" role="dialog" aria-modal="true" aria-labelledby="xpT"><div class="mbox xpbox">
  <div class="xph"><span class="xspin" aria-hidden="true"></span><b id="xpT"></b></div>
  <p class="xpe" id="xpE"></p>
  <div id="xpAskW" class="hidden"><div class="xpq"><span id="xpAsk"></span><small id="xpAskS"></small></div><input type="email" id="xpMail" autocomplete="email" inputmode="email"><div class="xperr" id="xpErr" aria-live="polite"></div><div class="xpb"><button class="clia-btn" id="xpNo" type="button"></button><button class="clia-btn primary" id="xpYes" type="button"></button></div></div>
  <div id="xpSetW" class="hidden"><div class="xpok"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg><span id="xpSet"></span></div></div>
  <p class="xpnote hidden" id="xpNote"></p>
  <div class="xpb" id="xpOkW"><button class="clia-btn primary" id="xpOk" type="button"></button></div>
</div></div>
<div class="modal hidden" id="rg" role="dialog" aria-modal="true" aria-labelledby="rgT"><div class="mbox rgbox">
  <div class="rgi" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></div>
  <b class="rgt" id="rgT"></b>
  <p class="rgb" id="rgB"></p>
  <div class="rgm" id="rgM"></div>
  <div class="xpb"><button class="clia-btn" id="rgNo" type="button"></button><button class="clia-btn primary" id="rgYes" type="button"></button></div>
</div></div>
<!-- 중단 확인 (실수로 내보내기를 눌렀을 때) -->
<div class="modal hidden" id="cf" role="dialog" aria-modal="true" aria-labelledby="cfT"><div class="mbox rgbox">
  <b class="rgt" id="cfT"></b>
  <p class="rgb" id="cfB"></p>
  <p class="xperr" id="cfErr" aria-live="polite"></p>
  <div class="xpb"><button class="clia-btn" id="cfNo" type="button"></button><button class="clia-btn primary" id="cfYes" type="button"></button></div>
</div></div>
<div class="modal hidden" id="frm" role="dialog" aria-modal="true"><div class="mbox"><div class="mh"><b id="frmT"></b><button class="pill" id="frmX"></button></div><div id="frmBody"></div><div class="fmsg" id="frmMsg"></div></div></div>
<div class="edov hidden" id="edov"><iframe id="edFrame" title="Builder"></iframe></div>
<!-- 한 건 상세 (2026-11-24): 행을 누르면 오른쪽 패널 -->
<div class="dw hidden" id="dw" role="dialog" aria-modal="true" aria-label="Detail">
  <div class="dw-bg"></div>
  <div class="dw-p">
    <div class="dw-top">
      <button type="button" class="dw-nav" id="dwPrev" aria-label="Previous">‹</button><span class="dw-pos" id="dwPos"></span><button type="button" class="dw-nav" id="dwNext" aria-label="Next">›</button>
      <label class="dw-inc" id="dwIncW"><input type="checkbox" id="dwInc"><span data-i="dwInclude"></span></label>
      <span class="sp"></span>
      <button type="button" class="dw-x" id="dwX" aria-label="Close">✕</button>
    </div>
    <div class="dw-body" id="dwBody"></div>
  </div>
</div>
<script src="../shared/clia-frame-picker.js"></script>
<script src="bulk-i18n.js"></script>
<script src="bulk-market.js"></script>
<script src="bulk-check.js"></script>
<script src="bulk.js"></script>
